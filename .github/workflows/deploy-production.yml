name: Deploy Production

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    name: deploy-production
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all
        run: bun run build

      - name: Create production deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'production',
              description: 'Production deployment',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: true,
              payload: JSON.stringify({ app: 'qahal', sourceWorkflow: 'CI' }),
            });
            core.setOutput('deployment_id', String(data.id));

      - name: Deploy Worker (Production)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.10.0 deploy --env production --config wrangler.toml

      - name: Deploy Pages (Production)
        id: deploy_pages
        working-directory: apps/miniapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.10.0 pages deploy dist --project-name qahal --branch main

      - name: Finalize production deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment: 'production',
              environment_url: 'https://app.qahal.xyz',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Production deployment complete',
            });
